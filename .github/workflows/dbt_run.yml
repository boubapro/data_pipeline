name: dbt run weekly

on:
  schedule:
    - cron: '0 18 * * 1'      # lundi 19h Paris été (UTC+1 → 18h UTC)
    # - cron: '0 17 * * 1'    # lundi 19h Paris hiver (UTC+2 → 17h UTC)
  workflow_dispatch:

env:
  DBT_TAG: monday_19h

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install --upgrade pip && pip install dbt-snowflake

      - name: Créer la clé privée RSA
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Créer profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << HEREDOC
          data_pipeline:
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /tmp/rsa_key.p8
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                threads: 4
                transient: false
            target: dev
          HEREDOC

      - name: dbt debug
        run: dbt debug

      - name: dbt deps
        run: dbt deps

      - name: dbt run
        run: dbt run --select tag:${{ env.DBT_TAG }}

      - name: dbt test
        run: dbt test --select tag:${{ env.DBT_TAG }}

      - name: dbt docs generate
        run: dbt docs generate

      - name: Supprimer la clé privée
        if: always()
        run: rm -f /tmp/rsa_key.p8
