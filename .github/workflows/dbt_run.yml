name: dbt run daily

on:
  schedule:
    - cron: 0 19 * * 1
    # - cron: '50 13 * * *'   # tous les jours à 14h50 heure Paris hiver (UTC+1)
  workflow_dispatch:

env:
  DBT_TAG: monday_19h

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Installer dbt
      - name: Install dbt-snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      # 4. Clé privée
      - name: Créer la clé privée RSA
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      # 5. profiles.yml
      - name: Créer profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          data_pipeline:
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /tmp/rsa_key.p8
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                threads: 4
                transient: false
            target: dev
          EOF

      # 6. Debug
      - name: dbt debug
        run: dbt debug

      # 7. Deps
      - name: dbt deps
        run: dbt deps

      # 8. Run modèles
      - name: dbt run
        run: dbt run --select tag:${{ env.DBT_TAG }}

      # 9. Tests
      - name: dbt test
        run: dbt test --select tag:${{ env.DBT_TAG }}

      # 10. Docs
      - name: dbt docs generate
        run: dbt docs generate

      # 11. Cleanup
      - name: Supprimer la clé privée
        if: always()
        run: rm -f /tmp/rsa_key.p8
