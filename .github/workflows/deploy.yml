name: Manual dbt deployment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DBT_TAG: every_monday_19h

jobs:
  dbt-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write RSA private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: Create dbt profile
        run: python scripts/write_dbt_profile.py /tmp/dbt-profiles

      - name: Select dbt target
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DBT_TARGET=prod" >> "$GITHUB_ENV"
          else
            echo "DBT_TARGET=dev" >> "$GITHUB_ENV"
          fi

      - name: Validate Snowflake connection
        run: dbt debug --profiles-dir /tmp/dbt-profiles --target "$DBT_TARGET"

      - name: Install dbt packages
        run: dbt deps --profiles-dir /tmp/dbt-profiles

      - name: Build (run + test + publish) scheduled models
        run: |
          dbt build --profiles-dir /tmp/dbt-profiles --target "$DBT_TARGET" --select "tag:${DBT_TAG}"

      - name: Remove RSA private key
        if: always()
        run: |
          rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH" /tmp/dbt-profiles/profiles.yml /tmp/dbt-profiles/.user.yml
          if [[ -d /tmp/dbt-profiles ]]; then rmdir /tmp/dbt-profiles; fi
