name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'events'
        required: true
        default: ''
        type: string

jobs:
  greet:
    runs-on: self-hosted

    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    steps:
      - name: Launch events
        run: dbt run -s "${{ inputs.name }}" -t "${ENV_NAME}"
