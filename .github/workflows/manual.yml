name: Manual dbt workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'dbt model to run'
        required: true
        type: string

jobs:
  dbt-run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create virtual env & install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Set DBT target environment
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "DBT_TARGET=prod" >> $GITHUB_ENV
          else
            echo "DBT_TARGET=dev" >> $GITHUB_ENV
          fi

      - name: dbt debug
        run: .venv/bin/dbt debug --profiles-dir . --target $DBT_TARGET

      - name: dbt deps
        run: .venv/bin/dbt deps

      - name: dbt run
        run: .venv/bin/dbt run -s "${{ inputs.model }}" --profiles-dir . --target $DBT_TARGET

      - name: dbt test
        run: .venv/bin/dbt test -s "${{ inputs.model }}" --profiles-dir . --target $DBT_TARGET
