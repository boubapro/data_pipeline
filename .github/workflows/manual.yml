name: Manual dbt workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'dbt model to run'
        required: true
        type: string

jobs:
  dbt-run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual env & install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Set DBT target environment
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "DBT_TARGET=prod" >> $GITHUB_ENV
          else
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '_')
            echo "DBT_TARGET=$SAFE_BRANCH" >> $GITHUB_ENV
          fi

      - name: dbt debug
        run: .venv/bin/dbt debug --target $DBT_TARGET

      - name: dbt deps
        run: .venv/bin/dbt deps

      - name: dbt run
        run: .venv/bin/dbt run -s "${{ inputs.model }}" --target $DBT_TARGET

      - name: dbt test
        run: .venv/bin/dbt test -s "${{ inputs.model }}" --target $DBT_TARGET
