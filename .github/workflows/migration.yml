name: Migrations Snowflake

"on":
  push:
    branches:
      - main
    paths:
      - "migrations/**"

env:
  SNOWFLAKE_ACCOUNT:           ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:              ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE:              ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE:         ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE:          ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA:            ${{ secrets.SNOWFLAKE_SCHEMA }}
  SNOWFLAKE_PRIVATE_KEY_PATH:  /tmp/rsa_key.p8

jobs:
  run-migrations:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write RSA private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Create virtual env & install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install snowflake-connector-python cryptography

      - name: Run migrations
        run: .venv/bin/python scripts/run_migrations.py

      - name: Delete RSA private key
        if: always()
        run: rm -f /tmp/rsa_key.p8
