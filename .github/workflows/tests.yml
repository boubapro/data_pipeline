name: dbt validation

on:
  pull_request:
    branches: [main, dev, int]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-validate:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
      SNOWFLAKE_ROLE: ci
      SNOWFLAKE_WAREHOUSE: ci
      SNOWFLAKE_DATABASE: CI_DATABASE
      SNOWFLAKE_SCHEMA: CI_SCHEMA
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/unused-rsa-key.p8
      DBT_TAG: every_monday_19h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profile
        run: python scripts/write_dbt_profile.py /tmp/dbt-profiles

      - name: Parse dbt project
        run: dbt parse --profiles-dir /tmp/dbt-profiles --no-partial-parse

      - name: Verify scheduled model selection
        run: |
          dbt ls --profiles-dir /tmp/dbt-profiles \
            --select "tag:${DBT_TAG}" \
            --resource-type model \
            --output name > /tmp/dbt-scheduled-models.txt
          for model in src_housing src_housing_v2 src_sales_v1 d_sales d_product f_sales \
            f_sales_daily f_sales_by_distributor f_sales_by_product f_sales_enriched; do
            grep -Fxq "$model" /tmp/dbt-scheduled-models.txt
          done

      - name: Test migration runner
        run: |
          python -m py_compile scripts/run_migrations.py
          python -m unittest discover -s tests

      - name: Remove temporary profile and key
        if: always()
        run: |
          rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH" /tmp/dbt-profiles/profiles.yml /tmp/dbt-profiles/.user.yml
          if [[ -d /tmp/dbt-profiles ]]; then rmdir /tmp/dbt-profiles; fi
