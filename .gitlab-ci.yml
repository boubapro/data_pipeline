image: python:3.11

stages:
  - deploy

.dbt-deploy:
  stage: deploy
  before_script:
    - pip install -r requirements.txt
    - |
      set -eu
      umask 077
      : "${SNOWFLAKE_ACCOUNT:?Set SNOWFLAKE_ACCOUNT for this GitLab environment}"
      : "${SNOWFLAKE_USER:?Set SNOWFLAKE_USER for this GitLab environment}"
      : "${SNOWFLAKE_ROLE:?Set SNOWFLAKE_ROLE for this GitLab environment}"
      : "${SNOWFLAKE_WAREHOUSE:?Set SNOWFLAKE_WAREHOUSE for this GitLab environment}"
      : "${SNOWFLAKE_DATABASE:?Set SNOWFLAKE_DATABASE for this GitLab environment}"
      : "${SNOWFLAKE_SCHEMA:?Set SNOWFLAKE_SCHEMA for this GitLab environment}"
      : "${SNOWFLAKE_PRIVATE_KEY:?Set SNOWFLAKE_PRIVATE_KEY as a GitLab File variable}"
      test -f "$SNOWFLAKE_PRIVATE_KEY"
      cp "$SNOWFLAKE_PRIVATE_KEY" /tmp/rsa_key.p8
      chmod 600 /tmp/rsa_key.p8
    - python scripts/write_dbt_profile.py .dbt-profile
  variables:
    DBT_PROFILES_DIR: .dbt-profile
  script:
    - dbt debug --profiles-dir .dbt-profile --target "$DBT_TARGET"
    - dbt deps
    - dbt build --profiles-dir .dbt-profile --target "$DBT_TARGET"
  after_script:
    - rm -f /tmp/rsa_key.p8 .dbt-profile/profiles.yml .dbt-profile/.user.yml
    - rmdir .dbt-profile 2>/dev/null || true

deploy-dev:
  extends: .dbt-deploy
  variables:
    DBT_TARGET: dev
    SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
  environment:
    name: dev
    deployment_tier: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy-int:
  extends: .dbt-deploy
  variables:
    DBT_TARGET: int
    SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
  environment:
    name: int
    deployment_tier: testing
  rules:
    - if: '$CI_COMMIT_BRANCH == "int"'

deploy-production:
  extends: .dbt-deploy
  variables:
    DBT_TARGET: prod
    SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
  environment:
    name: production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
