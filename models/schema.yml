version: 2

models:
  - name: src_housing_v2
    description: "Modèle housing nettoyé"
    config:
      tags: ['every_monday_19h']

sources:
  - name: src_housing_ext
    # Emplacement de la table `loyer` : configurable par environnement.
    # Par défaut : la base de la target dbt, schéma PUBLIC.
    schema: "{{ env_var('HOUSING_SOURCE_SCHEMA', '') or 'PUBLIC' }}"
    database: "{{ env_var('HOUSING_SOURCE_DATABASE', '') or target.database }}"
    tables:
      - name: loyer

  - name: src_sales
    schema: RAW
    database: "{{ target.database }}"
    tables:
      - name: src_sales
